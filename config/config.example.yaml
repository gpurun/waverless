# Waverless Configuration Example

server:
  port: 8090
  mode: debug  # debug, release
  api_key: ""  # API key for worker authentication (optional)

redis:
  addr: "localhost:16379"
  password: ""
  db: 0

postgres:
  host: "localhost"
  port: 15433
  user: "wavespeed"
  password: "wavespeed"
  database: "waverless"
  sslmode: "disable"
  timezone: "UTC"

queue:
  concurrency: 10
  max_retry: 3
  task_timeout: 3600

worker:
  heartbeat_interval: 30
  heartbeat_timeout: 90
  default_concurrency: 1

logger:
  level: info  # debug, info, warn, error
  output: console  # console, file, both
  file:
    path: "logs/waverless.log"
    max_size: 100      # MB per file
    max_backups: 3     # number of backup files
    max_age: 7         # days to keep
    compress: false    # compress rotated files

k8s:
  enabled: true
  namespace: "default"
  platform: "generic"  # generic, aliyun-ack, aws-eks
  config_dir: "config/k8s"

autoscaler:
  enabled: true
  interval: 30
  max_gpu_count: 100
  max_cpu_cores: 1000
  max_memory_gb: 2000
  scale_up_wait_seconds: 60  # Global wait-age threshold (seconds); endpoint may override
  starvation_time: 300

# Docker Registry Authentication (for private images)
docker:
  # Optional HTTP proxy for DockerHub API calls
  # Useful when direct access to DockerHub is blocked or slow
  proxy_url: "http://127.0.0.1:7890"  # Example: local proxy (used for both HTTP and HTTPS)
  # proxy_url: ""  # Leave empty to use environment variables (HTTP_PROXY, HTTPS_PROXY, http_proxy, https_proxy)

  # If proxy_url is not set, the system will automatically use standard proxy environment variables:
  # - HTTP_PROXY / http_proxy: for HTTP requests
  # - HTTPS_PROXY / https_proxy: for HTTPS requests
  # - NO_PROXY / no_proxy: for addresses that should bypass proxy

  registries:
    # Docker Hub authentication
    "https://index.docker.io/v1/":
      username: "your-dockerhub-username"
      password: "your-dockerhub-token"  # Use access token instead of password
      # OR use pre-encoded auth (base64 encoded username:password)
      # auth: "base64-encoded-credentials"

    # Add more registries as needed
    # "your-private-registry.com":
    #   username: "username"
    #   password: "password"

# Notification configuration
notification:
  # Feishu (Lark) webhook URL for image update notifications
  # You can create a webhook in Feishu group settings
  # If not set, will fallback to FEISHU_WEBHOOK_URL environment variable
  feishu_webhook_url: ""  # Example: "https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxx"

providers:
  deployment: "k8s"  # k8s, docker, novita, gongji
  queue: "redis"     # redis, mysql
  metadata: "postgres"  # postgres (persistent), redis (ephemeral)

# Novita Serverless Configuration
novita:
  enabled: false  # Enable Novita serverless provider
  api_key: ""     # Your Novita API key (Bearer token)
  base_url: "https://api.novita.ai"  # Novita API base URL
  config_dir: "./config"  # Configuration directory (contains specs.yaml and templates/)
  poll_interval: 10  # Poll interval for status updates (seconds, default: 10)

# Gongji (共绩算力) OpenAPI CoreDeploymentProvider — peer to Novita/RunPod (NOT K8s).
# Credentials via env/Secret only: GONGJI_TOKEN, GONGJI_SIGNING_KEY (PEM), GONGJI_ENABLED=true
gongji:
  enabled: false
  base_url: "https://openapi.suanli.cn"
  token: ""                 # or env GONGJI_TOKEN
  signing_key: ""           # RSA private key PEM; empty = token-only (simple) mode; env GONGJI_SIGNING_KEY
  api_version: "1.0.0"
  request_timeout: 30
  poll_interval: 10
  tenant_id: 0              # required for points list on some tenants; env GONGJI_TENANT_ID
  default_resource_mark: "" # from resource/search; env GONGJI_DEFAULT_RESOURCE_MARK
  default_region_name: ""
  key_id: ""                # optional ops rotation id; env GONGJI_KEY_ID
