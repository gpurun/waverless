      scaleUpThreshold:
        description: Queue threshold for scale up
        type: integer
      taskTimeout:
        description: Task timeout in seconds
        type: integer
    type: object
  waverless_pkg_interfaces.UpdateSpecRequest:
    properties:
      category:
        type: string
      displayName:
        type: string
      platforms:
        additionalProperties: true
        type: object
      resourceType:
        description: fixed, serverless
        type: string
      resources:
        $ref: '#/definitions/waverless_pkg_interfaces.ResourceRequirements'
      status:
        description: active, inactive, deprecated
        type: string
    type: object
  waverless_pkg_interfaces.VolumeInfo:
    properties:
      name:
        type: string
      source:
        additionalProperties: true
        type: object
      type:
        type: string
    type: object
  waverless_pkg_interfaces.VolumeMount:
    properties:
      mountPath:
        description: Mount path in container
        type: string
      pvcName:
        description: PVC name
        type: string
    type: object
  waverless_pkg_provider_k8s.DeployAppRequest:
    properties:
      enableDynamicPrio:
        description: Enable dynamic priority (default true)
        type: boolean
      enablePtrace:
        description: Enable SYS_PTRACE capability for debugging (only for fixed resource
          pools)
        type: boolean
      endpoint:
        description: Core variables (user input)
        type: string
      env:
        additionalProperties:
          type: string
        description: Custom environment variables
        type: object
      gpuCount:
        description: GPU count (1-N, resources = per-gpu-config * gpuCount)
        type: integer
      highLoadThreshold:
        description: High load threshold for priority boost (default 10)
        type: integer
      image:
        description: Image
        type: string
      imagePrefix:
        description: Image prefix for matching updates (e.g., "wavespeed/model-deploy:wan_i2v-default-")
        type: string
      maxPendingTasks:
        description: Maximum allowed pending tasks before warning clients (default
          1)
        type: integer
      maxReplicas:
        description: Maximum replica count (default 10)
        type: integer
      minReplicas:
        description: Auto-scaling configuration (optional)
        type: integer
      priority:
        description: Priority for resource allocation (0-100, default 50)
        type: integer
      priorityBoost:
        description: Priority boost amount when high load (default 20)
        type: integer
      registryCredential:
        allOf:
        - $ref: '#/definitions/waverless_pkg_provider_k8s.RegistryCredential'
        description: Registry credential for private images
      replicas:
        description: Replica count (default 1)
        type: integer
      scaleDownCooldown:
        description: Scale down cooldown in seconds (default 60)
        type: integer
      scaleDownIdleTime:
        description: Idle time in seconds before scale down (default 300)
        type: integer
      scaleUpCooldown:
        description: Scale up cooldown in seconds (default 30)
        type: integer
      scaleUpThreshold:
        description: Queue threshold for scale up (default 1)
        type: integer
      shmSize:
        description: Shared memory size (e.g., "1Gi", "512Mi")
        type: string
      specName:
        description: Spec name
        type: string
      taskTimeout:
        description: Task execution timeout in seconds (0 = use global default)
        type: integer
      validateImage:
        description: 'Whether to validate image before deployment (default: true)'
        type: boolean
      volumeMounts:
        description: PVC volume mounts
        items:
          $ref: '#/definitions/waverless_pkg_interfaces.VolumeMount'
        type: array
    required:
    - endpoint
    - image
    - specName
    type: object
  waverless_pkg_provider_k8s.RegistryCredential:
    properties:
      password:
        type: string
      registry:
        description: e.g., "docker.io", "ghcr.io"
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: Waverless Serverless GPU Task Orchestration API
  title: Waverless API
  version: "1.0"
paths:
  /{endpoint}/check:
    get:
      description: Returns whether task submission is recommended based on pending
        queue depth
      parameters:
      - description: Endpoint name
        in: path
        name: endpoint
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Check if task submission is recommended
      tags:
      - tasks
  /{endpoint}/runsync:
    post:
      consumes:
      - application/json
      description: Submit task to specified endpoint and wait for result
      parameters:
      - description: Endpoint name
        in: path
        name: endpoint
        required: true
        type: string
      - description: Wait timeout in milliseconds (if not set, wait indefinitely)
        in: query
        name: wait
        type: integer
      - description: Task request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/waverless_internal_model.SubmitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/waverless_internal_model.TaskResponse'
      summary: Submit task synchronously to specified endpoint
      tags:
      - tasks
  /{endpoint}/stats:
    get:
      description: Get queue status and worker information for specified endpoint
      parameters:
      - description: Endpoint name
        in: path
        name: endpoint
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get endpoint statistics
      tags:
      - tasks
  /{endpoint}/submit:
    post:
      consumes:
      - application/json
      description: Submit async task to specified endpoint queue
      parameters:
      - description: Endpoint name
        in: path
        name: endpoint
        required: true
        type: string
      - description: Task request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/waverless_internal_model.SubmitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/waverless_internal_model.SubmitResponse'
      summary: Submit task to specified endpoint
      tags:
      - tasks
  /api/v1/autoscaler/cluster-resources:
    get:
      description: Returns only cluster resource usage, without endpoint details and
        events
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get cluster resource status
      tags:
      - AutoScaler
  /api/v1/autoscaler/config:
    get:
      description: Get autoscaler global configuration parameters
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/waverless_pkg_autoscaler.Config'
      summary: Get global configuration
      tags:
      - AutoScaler
    put:
      description: Update autoscaler global configuration parameters (interval, max_gpu_count,
        max_cpu_cores, max_memory_gb, starvation_time)
      parameters:
      - description: Global configuration
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/waverless_pkg_autoscaler.Config'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update global configuration
      tags:
      - AutoScaler
  /api/v1/autoscaler/disable:
    post:
      description: Disable autoscaling functionality
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Disable autoscaler
      tags:
      - AutoScaler
  /api/v1/autoscaler/enable:
    post:
      description: Enable autoscaling functionality
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Enable autoscaler
      tags:
      - AutoScaler
  /api/v1/autoscaler/endpoints:
    get:
      description: List autoscaling configurations for all endpoints
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/waverless_pkg_interfaces.EndpointMetadata'
            type: array
      summary: List all endpoint configurations
      tags:
      - AutoScaler
  /api/v1/autoscaler/endpoints/{name}:
    get:
      description: Get autoscaling configuration for specified endpoint
      parameters:
      - description: Endpoint name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/waverless_pkg_interfaces.EndpointMetadata'
      summary: Get endpoint autoscaling configuration
      tags:
      - AutoScaler
    put:
      description: Update autoscaling configuration for specified endpoint
      parameters:
      - description: Endpoint name
        in: path
        name: name
        required: true
        type: string
      - description: Endpoint configuration
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/waverless_pkg_interfaces.EndpointMetadata'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update endpoint autoscaling configuration
      tags:
      - AutoScaler
  /api/v1/autoscaler/history/{name}:
    get:
      description: Get scaling history events for specified endpoint
      parameters:
      - description: Endpoint name
        in: path
        name: name
        required: true
        type: string
      - description: Limit (default 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/waverless_pkg_autoscaler.ScalingEvent'
            type: array
      summary: Get scaling history
      tags:
      - AutoScaler
  /api/v1/autoscaler/recent-events:
    get:
      description: Get recent scaling events for all endpoints
      parameters:
      - description: Event limit (default 10)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/waverless_pkg_autoscaler.ScalingEvent'
            type: array
      summary: Get recent scaling events
      tags:
      - AutoScaler
  /api/v1/autoscaler/status:
    get:
      description: Get current autoscaler system status, including cluster resources,
        endpoint status, etc.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/waverless_pkg_autoscaler.AutoScalerStatus'
      summary: Get autoscaler status
      tags:
      - AutoScaler
  /api/v1/autoscaler/trigger:
    post:
      description: Manually trigger one scaling decision and execution
      parameters:
      - description: Endpoint name (optional, empty means all)
        in: path
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Manually trigger scaling
      tags:
      - AutoScaler
  /api/v1/autoscaler/trigger/{name}:
    post:
      description: Manually trigger one scaling decision and execution
      parameters:
      - description: Endpoint name (optional, empty means all)
        in: path
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Manually trigger scaling
      tags:
      - AutoScaler
  /api/v1/config/default-env:
    get:
      consumes:
      - application/json
      description: Get default environment variables from wavespeed-config ConfigMap
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get default environment variables
      tags:
      - Config
  /api/v1/endpoints:
    get:
      description: Get all endpoint metadata and enrich with K8s runtime status (if
        available)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/waverless_pkg_interfaces.EndpointMetadata'
            type: array
      summary: List all endpoints (MySQL metadata primary)
      tags:
      - Endpoints
    post:
      consumes:
      - application/json
      description: 'Create a new endpoint: write metadata and trigger K8s deployment'
      parameters:
      - description: Deployment configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/waverless_pkg_provider_k8s.DeployAppRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Create endpoint
      tags:
      - Endpoints
  /api/v1/endpoints/{endpoint}/status-events:
    get:
      description: Get status events for a specific endpoint with optional filters
      parameters:
      - description: Endpoint name
        in: path
        name: endpoint
        required: true
        type: string
      - default: 50
        description: Maximum number of events to return
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of events to skip
        in: query
        name: offset
        type: integer
      - description: Filter events created at or after this time (RFC3339 format)
        in: query
        name: start_time
        type: string
      - description: Filter events created at or before this time (RFC3339 format)
        in: query
        name: end_time
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/app_handler.StatusEventResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List status events for endpoint
      tags:
      - Status Events
  /api/v1/endpoints/{name}:
    delete:
      description: Delete specified endpoint (including K8s deployment and metadata)
      parameters:
      - description: Endpoint name
        in: path
        name: name
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete endpoint
      tags:
      - Endpoints
    get:
      description: Read endpoint metadata from MySQL first, then enrich with K8s runtime
        status (if available)
      parameters:
      - description: Endpoint name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/waverless_pkg_interfaces.EndpointMetadata'
      summary: Get endpoint details (metadata primary, enriched with runtime status)
      tags:
      - Endpoints
    put:
      consumes:
      - application/json
      description: Update endpoint metadata and autoscaling config (does not directly
        modify K8s replicas/image)
      parameters:
      - description: Endpoint name
        in: path
        name: name
        required: true
        type: string
      - description: Configuration update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/waverless_pkg_interfaces.UpdateEndpointConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Update endpoint configuration (metadata + autoscaling config)
      tags:
      - Endpoints
  /api/v1/endpoints/{name}/check-image:
    post:
      description: Manually check if there's a new image version available for an
        endpoint
      parameters:
      - description: Endpoint name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Check image update for endpoint
      tags:
      - Endpoints
  /api/v1/endpoints/{name}/deployment:
    patch:
      consumes:
      - application/json
      description: Update endpoint's K8s deployment, such as upgrading image, adjusting
        replica count, etc.
      parameters:
      - description: Endpoint name
        in: path
        name: name
        required: true
        type: string
      - description: Update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/waverless_pkg_interfaces.UpdateDeploymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Update endpoint deployment
      tags:
      - Endpoints
  /api/v1/endpoints/{name}/logs:
    get:
      description: Get endpoint K8s logs
      parameters:
      - description: Endpoint name
        in: path
        name: name
        required: true
        type: string
      - default: 100
        description: Number of log lines
        in: query
        name: lines
        type: integer
      - description: Pod name (optional, get specific Pod logs if specified)
        in: query
        name: pod_name
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Get endpoint logs
      tags:
      - Endpoints
  /api/v1/endpoints/{name}/workers:
    get:
      description: Get all workers for specified endpoint, including creating, running,
        and terminating Pods
      parameters:
      - description: Endpoint name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/app_handler.WorkerWithPodInfo'
            type: array
      summary: Get endpoint workers (with Pod status)
      tags:
      - Endpoints
  /api/v1/endpoints/{name}/workers/exec:
    get:
      description: WebSocket connection to exec into worker pod
      parameters:
      - description: Endpoint name
        in: path
        name: name
        required: true
        type: string
      - description: Worker ID (Pod Name)
        in: query
        name: worker_id
        required: true
        type: string
      responses: {}
      summary: Worker Pod Exec
      tags:
      - Endpoints
  /api/v1/endpoints/{name}/workers/sync:
    get:
      description: Get all workers for specified endpoint including recently terminated
        OFFLINE workers (for Portal billing sync)
      parameters:
      - description: Endpoint name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/app_handler.WorkerWithPodInfo'
            type: array
      summary: Get endpoint workers for sync
      tags:
      - Endpoints
  /api/v1/endpoints/check-images:
    post:
      description: Manually check if there are new image versions available for all
        endpoints
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Check image updates for all endpoints
      tags:
      - Endpoints
  /api/v1/endpoints/preview:
    post:
      consumes:
      - application/json
      description: Preview K8s deployment YAML for endpoint
      parameters:
      - description: Deployment configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/waverless_pkg_provider_k8s.DeployAppRequest'
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Preview endpoint deployment YAML
      tags:
      - Endpoints
  /api/v1/k8s/pvcs:
    get:
      consumes:
      - application/json
      description: Get all PersistentVolumeClaims available in the namespace
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/waverless_pkg_interfaces.PVCInfo'
            type: array
      summary: List PVCs
      tags:
      - K8s
  /api/v1/k8s/specs:
    get:
      description: Get all available resource specs
      parameters:
      - description: Filter by category (cpu, gpu)
        in: query
        name: category
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/waverless_pkg_interfaces.SpecInfo'
            type: array
      summary: List all specs
      tags:
      - Specs
    post:
      consumes:
      - application/json
      description: Create a new resource specification
      parameters:
      - description: Spec creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/waverless_pkg_interfaces.CreateSpecRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/waverless_pkg_interfaces.SpecInfo'
      summary: Create spec
      tags:
      - Specs
  /api/v1/k8s/specs/{name}:
    delete:
      description: Delete a resource specification (soft delete)
      parameters:
      - description: Spec name
        in: path
        name: name
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Delete spec
      tags:
      - Specs
    get:
      description: Get detailed information for specified spec
      parameters:
      - description: Spec name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/waverless_pkg_interfaces.SpecInfo'
      summary: Get spec details
      tags:
      - Specs
    put:
      consumes:
      - application/json
      description: Update an existing resource specification
      parameters:
      - description: Spec name
        in: path
        name: name
        required: true
        type: string
      - description: Spec update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/waverless_pkg_interfaces.UpdateSpecRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/waverless_pkg_interfaces.SpecInfo'
      summary: Update spec
      tags:
      - Specs
  /api/v1/k8s/specs/{name}/capacity:
    get:
      description: Get capacity availability status for a specific spec
      parameters:
      - description: Spec name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/waverless_pkg_interfaces.CapacityEvent'
      summary: Get spec capacity
      tags:
      - Specs
  /api/v1/k8s/specs/capacity:
    get:
      description: Get all specs with their capacity availability status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/waverless_pkg_interfaces.SpecWithCapacity'
            type: array
      summary: List specs with capacity
      tags:
      - Specs
  /api/v1/specs:
    get:
      description: Get all available resource specs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/waverless_pkg_interfaces.SpecInfo'
            type: array
      summary: List all specs
      tags:
      - Specs
  /api/v1/specs/{name}:
    get:
      description: Get detailed information for specified spec
      parameters:
      - description: Spec name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/waverless_pkg_interfaces.SpecInfo'
      summary: Get spec details
      tags:
      - Specs
  /api/v1/statistics/endpoints:
    get:
      description: Get top endpoints sorted by total task count
      parameters:
      - description: 'Number of endpoints to return (default: 10, max: 50)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of top endpoints with their statistics
          schema:
            additionalProperties: true
            type: object
      summary: Get top endpoints by task volume
      tags:
      - statistics
  /api/v1/statistics/endpoints/{endpoint}:
    get:
      description: Get task statistics for a specific endpoint
      parameters:
      - description: Endpoint name
        in: path
        name: endpoint
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Endpoint statistics
          schema:
            additionalProperties: true
            type: object
