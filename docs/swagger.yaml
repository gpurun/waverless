        type: string
      displayName:
        description: Basic metadata
        type: string
      enableDynamicPrio:
        description: Enable dynamic priority
        type: boolean
      highLoadThreshold:
        description: High load threshold for priority boost
        type: integer
      imagePrefix:
        description: Image prefix for matching updates
        type: string
      maxPendingTasks:
        description: Maximum allowed pending tasks before warning clients
        type: integer
      maxReplicas:
        description: Maximum replicas
        type: integer
      minReplicas:
        description: Autoscaling configuration
        type: integer
      priority:
        description: Priority (0-100, 0 = best-effort)
        type: integer
      priorityBoost:
        description: Priority boost amount (0 = no boost)
