      pendingCount:
        type: integer
      platforms:
        additionalProperties: true
        type: object
      resourceType:
        description: fixed, serverless
        type: string
      resources:
        $ref: '#/definitions/waverless_pkg_interfaces.ResourceRequirements'
      runningCount:
        type: integer
      spotPrice:
        type: number
