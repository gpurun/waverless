          tag:
            type: string
        type: object
      repository:
        properties:
          name:
            type: string
          namespace:
            type: string
          repo_name:
            type: string
          status:
            type: string
        type: object
    type: object
  app_handler.StatusEventResponse:
    properties:
      createdAt:
        type: string
      endpoint:
        type: string
      eventType:
        type: string
      id:
        type: integer
      message:
        type: string
      newStatus:
        type: string
      oldStatus:
        type: string
      phase:
        type: string
      reason:
        type: string
      spotStatus:
        additionalProperties: {}
        type: object
      workerId:
        type: string
    type: object
  app_handler.WorkerDetailResponse:
    properties:
      concurrency:
        type: integer
      createdAt:
        type: string
      currentJobs:
        type: integer
      endpoint:
        type: string
      failureOccurredAt:
        description: Timestamp when failure was detected
        type: string
      failureReason:
        description: Sanitized user-friendly failure message
        type: string
      failureSuggestion:
        description: Actionable suggestion for the user
        type: string
      failureType:
        description: Failure information fields (Requirements 6.1, 6.2)
