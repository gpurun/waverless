      id:
        type: integer
      lastHeartbeat:
        type: string
      pendingMessage:
        description: Detailed message about pending state
        type: string
      pendingPhase:
        description: Pending phase information fields (Requirements 1.5, 2.4)
        type: string
      pendingPhaseSince:
        description: Timestamp when current pending phase started
        type: string
      pendingReason:
        description: Reason for pending state
        type: string
      podName:
        type: string
      podStartedAt:
        type: string
      spotInstanceType:
        description: Spot instance type (e.g., "g4dn.xlarge")
        type: string
      spotPrice:
        description: Spot instance cost tracking
        type: number
      status:
        type: string
      terminatedAt:
        type: string
      totalExecutionTimeMs:
        type: integer
      totalTasksCompleted:
        type: integer
      totalTasksFailed:
        type: integer
      updatedAt:
        type: string
      version:
        type: string
      workerId:
        type: string
    type: object
  app_handler.WorkerWithPodInfo:
    properties:
      concurrency:
        description: Maximum concurrency
        type: integer
      current_jobs:
        description: Current number of jobs
        type: integer
      deletionTimestamp:
        description: Set when pod is terminating
        type: string
      endpoint:
        description: Endpoint to which the worker belongs
        type: string
      failureReason:
        description: Sanitized user-friendly failure message
        type: string
      failureSuggestion:
        description: Actionable suggestion for the user
        type: string
      failureType:
        description: Failure information fields (Requirements 6.1, 6.2)
        type: string
      id:
        type: string
      jobs_in_progress:
        description: List of in-progress task IDs
        items:
          type: string
        type: array
      last_heartbeat:
        type: string
      last_task_time:
        description: Last time a task was completed (for idle tracking)
        type: string
      pendingMessage:
        description: Detailed message about pending state
        type: string
      pendingPhase:
        description: Pending phase information fields (Requirements 1.5, 2.4)
        type: string
      pendingPhaseSince:
        description: Timestamp when current pending phase started
        type: string
      pendingReason:
        description: Reason for pending state
        type: string
      pod_name:
        description: K8s pod name (from RUNPOD_POD_ID env)
        type: string
      podCreatedAt:
        description: Pod creation time
        type: string
      podIP:
        description: Pod IP
        type: string
      podMessage:
        description: Status message
        type: string
      podNodeName:
        description: Node name
        type: string
      podPhase:
        description: 'Pod phase: Pending, Running, Succeeded, Failed'
        type: string
      podReason:
        description: Status reason
        type: string
      podRestartCount:
        description: Container restart count
        type: integer
      podStartedAt:
        description: Pod start time
        type: string
      podStatus:
        description: 'Detailed status: Creating, Running, Terminating, etc.'
        type: string
      registered_at:
        type: string
      spotInstanceType:
        description: Spot instance type (e.g., "g4dn.xlarge")
        type: string
      spotPrice:
        description: Spot instance cost tracking
        type: number
      status:
        $ref: '#/definitions/waverless_internal_model.WorkerStatus'
      version:
        type: string
    type: object
  waverless_internal_model.JobInfo:
    properties:
      id:
        type: string
      input:
        additionalProperties: true
        type: object
    type: object
  waverless_internal_model.JobResultRequest:
    properties:
      error:
        type: string
      output:
        additionalProperties: true
        type: object
      stopPod:
        description: Consistent with runpod
        type: boolean
      task_id:
        description: TaskID can be passed via JSON body or X-Request-ID header
        type: string
    type: object
  waverless_internal_model.SubmitRequest:
    properties:
      endpoint:
        description: Specify endpoint, internal use
        type: string
      input:
        additionalProperties: true
        type: object
      webhook:
        type: string
    required:
    - input
    type: object
  waverless_internal_model.SubmitResponse:
    properties:
      id:
        type: string
      status:
        $ref: '#/definitions/waverless_internal_model.TaskStatus'
    type: object
  waverless_internal_model.TaskResponse:
    properties:
      createdAt:
        description: Task creation time (ISO 8601 format)
        type: string
      delayTime:
        description: Processing delay in milliseconds
        type: integer
      endpoint:
        description: Endpoint name
        type: string
      error:
        type: string
      executionTime:
        description: Execution time in milliseconds
        type: integer
      id:
        type: string
      input:
        additionalProperties: true
        type: object
      output:
        additionalProperties: true
        type: object
      status:
        type: string
      workerId:
        type: string
    type: object
  waverless_internal_model.TaskStatus:
    enum:
    - PENDING
    - IN_PROGRESS
    - COMPLETED
    - FAILED
    - CANCELLED
    type: string
    x-enum-comments:
      TaskStatusCancelled: Cancelled
      TaskStatusCompleted: Completed
      TaskStatusFailed: Failed
      TaskStatusInProgress: In Progress
      TaskStatusPending: Pending
    x-enum-varnames:
    - TaskStatusPending
    - TaskStatusInProgress
    - TaskStatusCompleted
    - TaskStatusFailed
    - TaskStatusCancelled
  waverless_internal_model.WorkerStatus:
    enum:
    - STARTING
    - ONLINE
    - OFFLINE
    - BUSY
    - DRAINING
    type: string
    x-enum-comments:
      WorkerStatusBusy: Busy - processing tasks
      WorkerStatusDraining: Draining - pod terminating, no new tasks
      WorkerStatusOffline: Offline - disconnected
      WorkerStatusOnline: Online - normal operation
      WorkerStatusStarting: Starting - pod created, waiting for heartbeat
    x-enum-varnames:
    - WorkerStatusStarting
    - WorkerStatusOnline
    - WorkerStatusOffline
    - WorkerStatusBusy
    - WorkerStatusDraining
  waverless_pkg_autoscaler.AutoScalerStatus:
    properties:
      blockedEndpoints:
        items:
          type: string
        type: array
      clusterResources:
        $ref: '#/definitions/waverless_pkg_autoscaler.ClusterResources'
      enabled:
        type: boolean
      endpoints:
        items:
          $ref: '#/definitions/waverless_pkg_autoscaler.EndpointStatus'
        type: array
      lastRunTime:
        type: string
      metrics:
        additionalProperties: true
        type: object
      pendingDecisions:
        items:
          $ref: '#/definitions/waverless_pkg_autoscaler.ScaleDecision'
        type: array
      recentEvents:
        items:
          $ref: '#/definitions/waverless_pkg_autoscaler.ScalingEvent'
        type: array
      running:
        type: boolean
      starvingEndpoints:
        items:
          type: string
        type: array
    type: object
  waverless_pkg_autoscaler.ClusterResources:
    properties:
      available:
        allOf:
        - $ref: '#/definitions/waverless_pkg_autoscaler.Resources'
        description: Available resources
      bySpec:
        additionalProperties:
          $ref: '#/definitions/waverless_pkg_autoscaler.Resources'
        description: Resources by spec type
        type: object
      total:
        allOf:
        - $ref: '#/definitions/waverless_pkg_autoscaler.Resources'
        description: Total resources
      used:
        allOf:
        - $ref: '#/definitions/waverless_pkg_autoscaler.Resources'
        description: Used resources
    type: object
  waverless_pkg_autoscaler.Config:
    properties:
      enabled:
        description: Whether autoscaling is enabled
        type: boolean
      interval:
        description: Control loop interval (seconds)
        type: integer
      maxCpuCores:
        description: Total cluster CPU cores
        type: integer
      maxGpuCount:
        description: Total cluster GPU count
        type: integer
      maxMemoryGB:
        description: Total cluster memory (GB)
        type: integer
      starvationTime:
        description: Starvation threshold (seconds), temporarily elevate priority
          if no resources allocated beyond this time
        type: integer
    type: object
  waverless_pkg_autoscaler.EndpointStatus:
    properties:
      currentReplicas:
        type: integer
      desiredReplicas:
        type: integer
      drainingReplicas:
        type: integer
      effectivePrio:
        type: integer
      enabled:
        type: boolean
      idleTime:
        description: Seconds
        type: number
      lastScaleTime:
        type: string
      lastTaskTime:
        type: string
      maxReplicas:
        type: integer
      minReplicas:
        type: integer
      name:
        type: string
      pendingTasks:
        type: integer
      priority:
        type: integer
      resourceUsage:
        $ref: '#/definitions/waverless_pkg_autoscaler.Resources'
      runningTasks:
        type: integer
      waitingTime:
        type: number
    type: object
  waverless_pkg_autoscaler.Resources:
    properties:
      cpuCores:
        type: number
      gpuCount:
        type: integer
      memoryGB:
        type: number
    type: object
  waverless_pkg_autoscaler.ScaleDecision:
    properties:
      approved:
        type: boolean
      basePriority:
        type: integer
      blocked:
        type: boolean
      blockedReason:
        type: string
      currentReplicas:
        type: integer
      desiredReplicas:
        type: integer
      endpoint:
        type: string
      preemptedFrom:
        description: Endpoints from which resources were preempted
        items:
          type: string
        type: array
      priority:
        description: Effective priority (including dynamic adjustments)
        type: integer
      queueLength:
        type: integer
      reason:
        type: string
      requiredResource:
        allOf:
        - $ref: '#/definitions/waverless_pkg_autoscaler.Resources'
        description: Required resources
      scaleAmount:
        description: Positive for scale up, negative for scale down
        type: integer
    type: object
  waverless_pkg_autoscaler.ScalingEvent:
    properties:
      action:
        description: '"scale_up", "scale_down", "blocked", "preempted"'
        type: string
      endpoint:
        type: string
      fromReplicas:
        type: integer
      id:
        type: string
      preemptedFrom:
        items:
          type: string
        type: array
      priority:
        type: integer
      queueLength:
        type: integer
      reason:
        type: string
      timestamp:
        type: string
      toReplicas:
        type: integer
    type: object
  waverless_pkg_interfaces.CapacityEvent:
    properties:
      reason:
        type: string
      specName:
        type: string
      status:
        $ref: '#/definitions/waverless_pkg_interfaces.CapacityStatus'
      updatedAt:
        type: string
    type: object
  waverless_pkg_interfaces.CapacityStatus:
    enum:
    - available
    - limited
    - sold_out
